name: Default

env:
  ACTION_ENVIRONMENT: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.23

      - name: Build
        run: go build -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m --issues-exit-code=0

      - name: Test
        run: go test -race -v -coverprofile=coverage_temp.out  -covermode=atomic ./...

      - name: Deadlock Detection Tests
        run: go test -race -tags=deadlock -timeout=90s -v ./ship ./hub

      - name: Stress Tests
        run: go test -race -tags=stress -timeout=180s ./ship ./hub

      - name: Remove test utilities from coverage
        run: |
          grep -v -E "/ship-go/(mocks/|internal/testing/|examples/)" coverage_temp.out > coverage.out || true
          echo "Coverage report filtered to exclude mocks and test utilities"

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.20.0
        with:
          # we let the report trigger content trigger a failure using the GitHub Security features.
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: results.sarif